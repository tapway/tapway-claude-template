[project]
name = "backend"
version = "0.1.0"
description = "[PROJECT_NAME] backend API"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Core dependencies (CPU-safe — no GPU-specific packages here)
# GPU extras are declared below so devs can install only what they need
# ---------------------------------------------------------------------------
dependencies = [
    # Web
    "fastapi>=0.111",
    "granian>=1.3",              # Team-standard ASGI server (replaces uvicorn)
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # DB / ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",           # PostgreSQL async driver
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Observability
    "structlog>=24.1",           # Team-standard JSON logging
    "pyyaml>=6.0",               # Config file support
    # Resilience
    "slowapi>=0.1.9",            # Rate limiting
    "httpx>=0.27.0",             # Async HTTP client
]

[project.optional-dependencies]
# GPU variants — install exactly one:
#   uv sync --extra cuda124
#   uv sync --extra cuda118
#   uv sync --extra rocm
#   uv sync --extra cpu   (default)
cuda124 = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
cuda118 = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]
rocm = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
cpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]

# Developer tools — install with: uv sync --extra dev
dev = [
    "httpx>=0.27",
    "ipykernel>=6.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "factory-boy>=3.3.0",
    "sqlalchemy[mypy]>=2.0.0",
]

[project.scripts]
app = "src.main:main"

# ---------------------------------------------------------------------------
# uv source overrides — point each GPU extra at the right index
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda124", extra = "cuda124" },
    { index = "pytorch-cuda118", extra = "cuda118" },
    { index = "pytorch-rocm",    extra = "rocm"    },
    { index = "pytorch-cpu",     extra = "cpu"     },
]
torchvision = [
    { index = "pytorch-cuda124", extra = "cuda124" },
    { index = "pytorch-cuda118", extra = "cuda118" },
    { index = "pytorch-rocm",    extra = "rocm"    },
    { index = "pytorch-cpu",     extra = "cpu"     },
]

[[tool.uv.index]]
name = "pytorch-cuda124"
url  = "https://download.pytorch.org/whl/cu124"

[[tool.uv.index]]
name = "pytorch-cuda118"
url  = "https://download.pytorch.org/whl/cu118"

[[tool.uv.index]]
name = "pytorch-rocm"
url  = "https://download.pytorch.org/whl/rocm6.0"

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (PEP 8 compliant)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "B", "S"]
ignore = [
    "E501",   # line too long — handled by formatter
    "S101",   # allow assert in tests
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
